<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>景點觀光展覽資訊</title>
  <!-- Bootstrap 5 (table-striped, table-hover) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  />
  <style>
    body {
      font-family: "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      padding: 20px;
    }
    h1 {
      display: inline-block;
      margin-right: 16px;
    }
    #searchBox {
      padding: 6px 10px;
      font-size: 16px;
      border: 1px solid #999;
      border-radius: 4px;
      width: 220px;
      vertical-align: middle;
    }
    /* 把表頭做成投影片那種綠底白字 */
    #csie thead th {
      background-color: #2e8b57;
      color: #fff;
      border-color: #2e8b57;
    }
    #pager {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #pager button {
      padding: 4px 12px;
      cursor: pointer;
    }
    #pager button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }
    #pageInfo {
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div>
    <h1>景點觀光展覽資訊</h1>
    <input
      id="searchBox"
      type="text"
      placeholder="搜尋名稱..."
      onchange="onSearchChange()"
      oninput="onSearchChange()"
    />
  </div>

  <table id="csie" class="table table-striped table-hover">
    <thead>
      <tr>
        <th>名稱</th>
        <th>地點</th>
        <th>票價</th>
      </tr>
    </thead>
    <tbody id="csieBody"></tbody>
  </table>

  <div id="pager">
    <button id="prevBtn" onclick="goPrev()">上一頁</button>
    <span id="pageInfo">1 / 1 頁</span>
    <button id="nextBtn" onclick="goNext()">下一頁</button>
  </div>

  <script>
    // ====== 狀態 ======
    var allData = [];      // API 回傳的全部資料
    var filtered = [];     // 套用搜尋之後的資料
    var currentPage = 1;
    var pageSize = 10;
    var keyword = "";

    // ====== Ajax 抓資料(投影片 page 52 的寫法) ======
    var openUrl =
      "https://cloud.culture.tw/frontsite/trans/SearchShowAction.do?method=doFindTypeJ&category=6";
    var xhr = new XMLHttpRequest();
    xhr.open("GET", openUrl, true);
    xhr.send();
    xhr.onreadystatechange = function () {
      if (this.readyState === 4 && this.status === 200) {
        allData = JSON.parse(this.responseText);
        applyFilter();
      }
    };

    // ====== 套用搜尋條件,重新計算 filtered ======
    function applyFilter() {
      if (keyword === "") {
        filtered = allData;
      } else {
        var kw = keyword.toLowerCase();
        filtered = allData.filter(function (data) {
          var title = (data.title || "").toLowerCase();
          return title.indexOf(kw) !== -1;
        });
      }
      currentPage = 1; // 搜尋後重設到第一頁
      renderTable();
    }

    // ====== 把當前頁的資料畫到 table ======
    function renderTable() {
      var tbody = document.getElementById("csieBody");
      tbody.innerHTML = "";

      var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      var start = (currentPage - 1) * pageSize;
      var end = start + pageSize;
      var pageData = filtered.slice(start, end);

      pageData.forEach(function (data) {
        var row = tbody.insertRow(-1);
        row.insertCell(0).innerHTML = data.title || "";
        var loc = "";
        var price = "";
        if (data.showInfo && data.showInfo.length > 0) {
          loc = data.showInfo[0].location || "";
          price = data.showInfo[0].price || "";
        }
        row.insertCell(1).innerHTML = loc;
        row.insertCell(2).innerHTML = price;
      });

      // 更新分頁資訊
      document.getElementById("pageInfo").innerText =
        currentPage + " / " + totalPages + " 頁";
      document.getElementById("prevBtn").disabled = currentPage <= 1;
      document.getElementById("nextBtn").disabled = currentPage >= totalPages;
    }

    // ====== 上一頁 / 下一頁 ======
    function goPrev() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    }
    function goNext() {
      var totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    }

    // ====== 搜尋輸入變更時觸發(onchange / oninput) ======
    function onSearchChange() {
      keyword = document.getElementById("searchBox").value.trim();
      applyFilter();
    }
  </script>
</body>
</html>
